exclude: ^(web/vendor/|spike/)
repos:
  - repo: local
    hooks:
      - id: lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
      - id: test
        name: make test
        entry: make test
        language: system
        pass_filenames: false
      - id: js-test
        name: make js-test
        entry: make js-test
        language: system
        pass_filenames: false
